<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <header>
      <h1 class="logo-text">AntiSocialize</h1>
    </header>

    <div style="text-align: center;">
      <div id="status-badge" class="status-badge status-inactive">Inactive</div>
    </div>

    <div class="section">
      <h2 class="section-title">Blocked Sites</h2>
      <div class="site-list" id="site-list">
        <label class="site-item"><input type="checkbox" value="facebook.com"> Facebook</label>
        <label class="site-item"><input type="checkbox" value="instagram.com"> Instagram</label>
        <label class="site-item"><input type="checkbox" value="tiktok.com"> TikTok</label>
        <label class="site-item"><input type="checkbox" value="reddit.com"> Reddit</label>
        <label class="site-item"><input type="checkbox" value="twitter.com"> Twitter/X</label>
        <label class="site-item"><input type="checkbox" value="youtube.com"> YouTube</label>
        <label class="site-item"><input type="checkbox" value="threads.net"> Threads</label>
        <label class="site-item"><input type="checkbox" value="netflix.com"> Netflix</label>
      </div>
      <div class="custom-site">
        <input type="text" id="custom-domain" placeholder="example.com">
        <button class="btn-add" id="btn-add-domain">+</button>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Blocking Mode</h2>
      <div class="mode-selector">
        <div class="mode-btn active" data-mode="infinite" id="mode-infinite">Infinite (Count up)</div>
        <div class="mode-btn" data-mode="timer" id="mode-timer">Timer (Count down)</div>
      </div>
      
      <div id="timer-settings" style="display: none; margin-bottom: 10px;">
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
          <button class="preset-btn" data-time="15">15m</button>
          <button class="preset-btn" data-time="30">30m</button>
          <button class="preset-btn" data-time="60">60m</button>
        </div>
        <input type="number" id="timer-input" class="timer-input" placeholder="Minutes to block..." min="1" max="1440" style="display: block; width: 100%;">
      </div>
      <button id="btn-start" class="start-btn">Start Blocking</button>
      <button id="btn-stop" class="stop-btn">Stop Blocking</button>
    </div>

    <div class="section">
      <h2 class="section-title">Addiction Stats</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="stat-attempts">0</div>
          <div class="stat-label">Attempts</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-bypassed">0</div>
          <div class="stat-label">Bypassed</div>
        </div>
      </div>
    </div>
  </div>

  <div id="stop-modal"
    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 13, 13, 0.98); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; box-sizing: border-box; text-align: center;">
    <h2 style="color:#ff2d2d; margin-top:0;">STOP TIMER</h2>
    <p style="font-size: 14px; margin-bottom: 20px; color: #ccc;">You cannot disable the timer easily. Solve this to
      stop:</p>

    <div id="popup-question-text" style="font-size: 18px; font-weight: bold; margin-bottom: 20px; color: white;"></div>
    <div id="popup-options" style="width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
    </div>

    <div id="popup-error-msg" style="color: #ff2d2d; font-weight: bold; min-height: 20px; margin-bottom: 10px;"></div>

    <button id="btn-stop-cancel" class="stop-btn visible" style="width: 100%;">Cancel</button>
  </div>

  <script src="questions.js"></script>
  <script src="popup.js"></script>
</body>

</html>
